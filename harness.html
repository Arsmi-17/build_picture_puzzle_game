<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Platform Harness</title>
<style>
  html,body{margin:0;background:#0b0b0f;color:#e6e6ea;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace}
  #log{padding:10px 12px;white-space:pre-wrap;word-break:break-word}
  .ok{color:#4ade80}.bad{color:#f87171}.warn{color:#fbbf24}.dim{color:#8b8b9c}
  button{background:#2b6cff;color:#fff;border:0;border-radius:8px;padding:14px 20px;font:inherit;font-weight:700;margin:12px}
  button.alt{background:#333344}
</style>
</head>
<body>
<div>
  <button id="play">Play (exactly like the platform does)</button>
  <button id="copy" class="alt">Copy report</button>
</div>
<div id="log"></div>

<script>
var lines = [], logEl = document.getElementById('log');
function say(m, c) {
  lines.push(m);
  var s = document.createElement('span');
  if (c) s.className = c;
  s.textContent = m + '\n';
  logEl.appendChild(s);
}
window.addEventListener('error', function (e) { say('[error] ' + (e.message || ''), 'bad'); });

say('This reproduces the platform\'s mobile play sequence:', 'dim');
say('  1. mount the game in an iframe inside an OFF-SCREEN wrapper (left:-10000px)', 'dim');
say('  2. immediately requestFullscreen() on its container', 'dim');
say('  3. screen.orientation.lock("landscape")   <- what your DB currently says', 'dim');
say('  4. letterbox the iframe to a 16:9 box', 'dim');
say('');
say('Tap Play. If the game goes BLACK here, the platform harness is the cause.', 'warn');
say('');

document.getElementById('play').onclick = function () {
  this.disabled = true;

  // 1. off-screen wrapper, exactly like MobileGameLanding
  var off = document.createElement('div');
  off.style.cssText = 'position:fixed;left:-10000px;top:0;height:100dvh;width:100dvw;overflow:hidden;background:#000';

  var container = document.createElement('div');   // <- the element that goes fullscreen
  container.style.cssText = 'position:relative;background:#000;width:100%;height:100%;display:flex;align-items:center;justify-content:center';

  var box = document.createElement('div');         // <- the letterbox wrapper
  box.style.cssText = 'position:relative;overflow:hidden';

  var iframe = document.createElement('iframe');
  iframe.src = './index.html';
  iframe.setAttribute('allow', 'fullscreen; accelerometer; gyroscope; microphone');
  iframe.setAttribute('allowfullscreen', '');
  iframe.scrolling = 'no';
  iframe.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;border:0;background:#000';

  box.appendChild(iframe);
  container.appendChild(box);
  off.appendChild(container);
  document.body.appendChild(off);
  say('iframe mounted off-screen', 'dim');

  function letterbox() {
    var availW = container.clientWidth, availH = container.clientHeight;
    if (!availW || !availH) return;
    var aspect = 16 / 9;                 // orientation = "landscape" (your DB value)
    var w = availW, h = w / aspect;
    if (h > availH) { h = availH; w = h * aspect; }
    box.style.width = Math.floor(w) + 'px';
    box.style.height = Math.floor(h) + 'px';
  }
  letterbox();

  // 2. fullscreen the container (same as GameEmbed.enterFullscreen)
  var req = container.requestFullscreen ? container.requestFullscreen() : Promise.reject(new Error('no requestFullscreen'));
  Promise.resolve(req).then(function () {
    say('requestFullscreen: OK', 'ok');
    // 3. lock orientation
    try {
      var lock = screen.orientation && screen.orientation.lock ? screen.orientation.lock('landscape') : null;
      Promise.resolve(lock).then(
        function () { say('orientation.lock("landscape"): OK -> phone rotated', 'ok'); },
        function (e) { say('orientation.lock failed: ' + e.message, 'warn'); }
      );
    } catch (e) { say('orientation.lock threw: ' + e.message, 'warn'); }
  }, function (e) {
    say('requestFullscreen FAILED: ' + e.message, 'bad');
  });

  window.addEventListener('resize', letterbox);
  document.addEventListener('fullscreenchange', function () { setTimeout(letterbox, 50); setTimeout(letterbox, 400); });

  // 4. Watch the game's canvas. Same-origin, so unlike the real platform we can
  //    actually SEE whether the WebGL context dies.
  iframe.onload = function () {
    say('iframe loaded', 'dim');
    var w = iframe.contentWindow, d = iframe.contentDocument;
    var tries = 0;
    var t = setInterval(function () {
      tries++;
      var cv = d.querySelector('canvas');
      if (cv && !cv.__watched) {
        cv.__watched = true;
        say('canvas found: ' + cv.width + 'x' + cv.height + ' (drawing buffer)', 'dim');
        cv.addEventListener('webglcontextlost', function (ev) {
          say('*** WEBGL CONTEXT LOST *** -> this is the black screen', 'bad');
        });
        cv.addEventListener('webglcontextrestored', function () { say('webgl context restored', 'ok'); });
      }
      if (cv && tries % 6 === 0) {
        var r = cv.getBoundingClientRect();
        // Sample the canvas: if every pixel is black the game is not painting.
        var gl = null;
        try { gl = cv.getContext('webgl2') || cv.getContext('webgl'); } catch (e) {}
        say('t+' + tries + 's  css=' + Math.round(r.width) + 'x' + Math.round(r.height) +
            '  buffer=' + cv.width + 'x' + cv.height +
            '  ctxLost=' + (gl ? gl.isContextLost() : '?'), gl && gl.isContextLost() ? 'bad' : 'dim');
      }
      if (tries > 40) clearInterval(t);
    }, 1000);
  };
};

document.getElementById('copy').onclick = function () {
  var text = lines.join('\n'), btn = this;
  function done() { btn.textContent = 'Copied!'; setTimeout(function () { btn.textContent = 'Copy report'; }, 1500); }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, function () { prompt('Copy:', text); });
  else prompt('Copy:', text);
};
</script>
</body>
</html>
