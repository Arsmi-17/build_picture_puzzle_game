<!DOCTYPE html>
<html lang="en-us">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,height=device-height,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Unity Web Player | Puzzle</title>
<style>
html,body{
margin:0;padding:0;width:100%;height:100%;
overflow:hidden;background:#000;
}
#unity-container{
position:fixed;inset:0;
overflow:hidden;
background:#000;
}
/* Fill the frame edge to edge. The old shell pinned the canvas to a 1080x1920
   box, which left black bars filling the rest of the screen. */
#unity-canvas{
display:block;
width:100%;
height:100%;
background:#000;
}
#unity-loading-bar{
position:absolute;
left:50%;top:50%;
transform:translate(-50%,-50%);
color:#fff;
font-family:Arial,sans-serif;
text-align:center;
}
#unity-error{
position:absolute;
left:50%;top:50%;
transform:translate(-50%,-50%);
display:none;
max-width:88%;
padding:14px 16px;
border-radius:10px;
background:#7f1d1d;
color:#fff;
font:13px/1.5 Arial,sans-serif;
}
</style>
</head>
<body>

<div id="unity-container">
<canvas id="unity-canvas" tabindex="-1"></canvas>

<div id="unity-loading-bar">
Loading...
<div style="width:200px;height:8px;background:#333;margin-top:10px;">
<div id="unity-progress-bar-full" style="height:100%;width:0%;background:#fff;"></div>
</div>
</div>

<div id="unity-error"></div>
</div>

<script>
var canvas = document.querySelector("#unity-canvas");
var errorBox = document.querySelector("#unity-error");

// Never swallow engine errors. The previous shell logged them to the console
// only, so a failure on a phone looked like an unexplained black screen.
function showError(msg) {
  errorBox.style.display = "block";
  errorBox.textContent = String(msg);
}
function unityShowBanner(msg, type) {
  if (type === "error") showError(msg);
  console.log(msg);
}
window.addEventListener("error", function (e) { showError(e.message || "Runtime error"); });

var buildUrl = "Build";

var config = {
  arguments: [],
  dataUrl: buildUrl + "/puzzle.data.unityweb",
  frameworkUrl: buildUrl + "/puzzle.framework.js.unityweb",
  codeUrl: buildUrl + "/puzzle.wasm.unityweb",
  streamingAssetsUrl: "StreamingAssets",
  companyName: "DefaultCompany",
  productName: "Puzzle",
  productVersion: "1.0",
  showBanner: unityShowBanner
};

// A full-DPR framebuffer on a phone (DPR 3 -> 3x the pixels) is the most common
// way to lose the WebGL context when the canvas is resized mid-render, which
// shows up as a black screen. Render at 1x on mobile.
var isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ||
  (window.matchMedia && window.matchMedia("(pointer: coarse)").matches);
config.devicePixelRatio = Math.min(isMobile ? 1 : 2, Math.max(1, window.devicePixelRatio || 1));

canvas.addEventListener("webglcontextlost", function (e) { e.preventDefault(); showError("WebGL context lost."); });

var script = document.createElement("script");
script.src = buildUrl + "/puzzle.loader.js";

script.onload = function () {
  createUnityInstance(canvas, config, function (progress) {
    document.querySelector("#unity-progress-bar-full").style.width = (progress * 100) + "%";
  }).then(function () {
    document.querySelector("#unity-loading-bar").style.display = "none";
  }).catch(function (err) {
    showError((err && err.message) || err);
  });
};
script.onerror = function () { showError("Failed to load " + script.src); };

document.body.appendChild(script);
</script>

</body>
</html>
